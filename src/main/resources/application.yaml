spring:
  application:
    name: FlashScale


  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: flashscale-reservation-workers
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:flashscale}
    username: ${DB_USER:flashscale}
    password: ${DB_PASSWORD:flashscale_dev}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migrations


server:
  port: 8080


management:
  endpoints:
    web:
      exposure:
        include : health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always


flashscale:
  kafka:
    topic: flashscale.reservations.v1
  outbox:
    poll-delay-ms: 500
  admission:
    max-inflight: 100
    permit-lease-ms: 30000
    user-burst: 10
    user-refill-per-second: 5


  stock:
    lease-ms: 30000


