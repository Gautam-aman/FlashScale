spring:
  application:
    name: FlashScale

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:flashscale}
    username: ${DB_USER:flashscale}
    password: ${DB_PASSWORD:flashscale_dev}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migrations


server:
  port: 8080


management:
  endpoints:
    web:
      exposure:
        include : health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always


flashscale:
  admission:
    max-inflight: 32
    permit-lease-ms: 30000
    user-burst: 10
    user-refill-per-second: 5


