services:
  db:
    image: postgres:17-alpine
    container_name: flashscale-postgres
    environment:
      POSTGRES_DB: flashscale
      POSTGRES_USER: flashscale
      POSTGRES_PASSWORD: flashscale_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U flashscale -d flashscale
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: apache/kafka:4.1.2
    container_name: flashscale-kafka
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  redis:
    image: redis:7.4-alpine
    container_name: flashscale-redis
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


volumes:
  postgres_data:
  kafka_data:
